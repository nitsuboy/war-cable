services:
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: duo-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - duo-net

networks:
  duo-net:
    driver: bridge
